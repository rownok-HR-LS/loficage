# Render Blueprint: the LOFICAGE game server (free web service, WebSockets).
services:
  - type: web
    name: loficage-server
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
